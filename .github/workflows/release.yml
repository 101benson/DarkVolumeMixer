name: Release

# Startet, wenn ein Tag wie v2.0.1 gepusht wird:
#   git tag v2.0.1
#   git push origin v2.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish DarkVolumeMixer.csproj -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Dark Volume Mixer ${{ github.ref_name }}
          files: publish/DarkVolumeMixer.exe
          body_path: RELEASE_NOTES.md
