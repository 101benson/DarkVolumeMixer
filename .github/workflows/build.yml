name: Build

# Prüft bei jedem Push und Pull Request, ob das Projekt baut.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build DarkVolumeMixer.csproj -c Release
